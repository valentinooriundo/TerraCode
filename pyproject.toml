[project]
name = "terracode"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=1.1.2",
    # GPS del celular para el registro de campo
    "flet-geolocator==1.1.2",
    # Certificados raíz para HTTPS (api.rapiditto.com) dentro del APK y en Windows
    "certifi>=2024.8.30",
]

[dependency-groups]
dev = [
    "flet-cli>=1.1.2",
    "flet-desktop>=1.1.2",
    "flet-web>=1.1.2",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=1.1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "com.terracode"
product = "TerraCode"
company = "TerraCode"
copyright = "Copyright (C) 2023-2026 by Flet"

# src/assets/icon.png is the icon for every platform. Keep it transparent and
# filling the whole canvas: web, Windows and Linux show it as-is, and Flet
# shrinks it to the margin iOS, macOS and Android each mask away. This colour
# is what sits behind it where transparency cannot survive - the iOS icon, the
# macOS tile and the Android background layer. Defaults to white.
# icon_background = "#ffffff"

[tool.flet.app]
path = "src"

# Ubicación de la parcela en el registro de campo
[tool.flet.android.permission]
"android.permission.ACCESS_FINE_LOCATION" = true
"android.permission.ACCESS_COARSE_LOCATION" = true

[tool.flet.ios.info]
NSLocationWhenInUseUsageDescription = "TerraCode usa tu ubicación para registrar la parcela y recomendar cultivos."
