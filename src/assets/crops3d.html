<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cultivos 3D · TerraSprout</title>
<link rel="stylesheet" href="./assistant-globe.css?v=modal-2">
<script type="module" src="./assistant-launcher.js?v=modal-2"></script>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#0b1c16;color:#f0f5e9}
body{margin:0}header,main{max-width:1120px;margin:auto;padding:20px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px}
a{color:#bde69d}h1{margin:0 0 18px;font-size:clamp(2rem,5vw,3.5rem)}
.gallery{display:grid;grid-template-columns:minmax(0,1fr) 285px;gap:16px}
.stage,aside{background:#142c23;border:1px solid #355544;border-radius:20px}
.stage{overflow:hidden;position:relative}.stage h2{margin:0;padding:18px 22px}
#scene{height:clamp(310px,60vh,650px)}canvas{display:block;touch-action:none}
.actions{padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#status{color:#cee2cb;font-size:.85rem}
aside{padding:16px}fieldset{border:0;margin:0 0 18px;padding:0}
legend{font-weight:700;margin-bottom:9px} .choices{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-size:.88rem;color:inherit;background:#234537;border:1px solid #426653;
border-radius:10px;padding:8px 11px;cursor:pointer;min-height:36px}
button[aria-pressed=true]{background:#bde69d;color:#112417;border-color:#bde69d}
button:focus-visible,a:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media(max-width:680px){.gallery{grid-template-columns:1fr}header,main{padding:12px}}
</style>
<header><strong>TerraSprout</strong><nav><a target="_top" href="/">Inicio</a> · <a target="_top" href="/mapa">Mapa</a></nav></header>
<main>
  <h1>Cultivos 3D</h1>
  <div class="gallery">
    <section class="stage" aria-labelledby="model-name">
      <h2 id="model-name">Maíz</h2>
      <div id="scene"></div>
      <div class="actions">
        <button id="left" aria-label="Girar a la izquierda">↶</button>
        <button id="right" aria-label="Girar a la derecha">↷</button>
        <button id="out" aria-label="Alejar">−</button>
        <button id="in" aria-label="Acercar">+</button>
        <span id="status" role="status">Cargando visor 3D…</span>
      </div>
    </section>
    <aside aria-label="Modelos y partes">
      <fieldset><legend>Partes del modelo</legend><div id="parts" class="choices"></div></fieldset>
      <fieldset><legend>Cultivos</legend><div id="crops" class="choices"></div></fieldset>
      <fieldset><legend>Sistemas de riego</legend><div id="water" class="choices"></div></fieldset>
    </aside>
  </div>
</main>
<a class="assistant-globe" href="/asistente" target="_top"
   aria-label="Abrir asistente agrícola" title="Abrir asistente agrícola"></a>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}
</script>
<script type="module">
const status = document.querySelector("#status");
try {
  const { mountGallery } = await import("./crops3d.js");
  const params = new URLSearchParams(location.search);
  mountGallery({ crop: params.get("cultivo"), irrigation: params.get("riego") });
  status.textContent = "Arrastra para girar · desplaza para acercar";
} catch (error) {
  status.textContent = "No se pudo abrir el visor 3D. Recarga la página o comprueba WebGL.";
  console.error(error);
}
</script>
</html>
